openapi: 3.1.0
info:
  title: Inventory REST API
  version: 1.0.0
servers:
- url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Item:
      type: object
      properties:
        variantId:
          type: string
        quantity:
          type: number
        unitCostCents:
          type: number
      required:
      - variantId
      - quantity
      - unitCostCents
    StockOnboarding:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        status:
          type: string
          enum:
          - draft
          - submitted
        asOfDate:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Barcode:
      type: object
      properties:
        value:
          type: string
        symbology:
          type: string
    BarcodeAssignment:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        barcode:
          $ref: '#/components/schemas/Barcode'
        source:
          type: string
        isPrimary:
          type: boolean
        assignedAt:
          type: string
    ProductVariant:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        trackingMode:
          type: string
          enum:
          - quantity
          - serial
          - lot
        attributes:
          type: array
          items:
            type: object
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/BarcodeAssignment'
        weightGrams:
          type: number
        volumeCubicMeters:
          type: number
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
    JournalLine:
      type: object
      properties:
        accountCode:
          type: string
        amountCents:
          type: number
        type:
          type: string
          enum:
          - debit
          - credit
        memo:
          type: string
    JournalEntry:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        date:
          type: string
        description:
          type: string
        method:
          type: string
          enum:
          - cash
          - accrual
        referenceId:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
    StatusTransition:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        reason:
          type: string
        actor:
          type: string
        occurredAt:
          type: string
        referenceId:
          type: string
    SerializedItem:
      type: object
      properties:
        id:
          type: string
        variantId:
          type: string
        serialNumber:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        status:
          type: string
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusTransition'
    ShopifyConnection:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        platform:
          type: string
        storeDomain:
          type: string
        isActive:
          type: boolean
    InventoryItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        quantity:
          type: number
        version:
          type: number
    ForecastingReportItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        currentStock:
          type: number
        salesVelocity7d:
          type: number
        salesVelocity30d:
          type: number
        salesVelocity90d:
          type: number
        forecastedDemand:
          type: number
        suggestedROP:
          type: number
        safetyStock:
          type: number
    FulfillmentAllocation:
      type: object
      properties:
        locationId:
          type: string
        quantity:
          type: number
    FulfillmentPlan:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/FulfillmentAllocation'
        totalCost:
          type: number
        totalDistance:
          type: number
        splitCount:
          type: number
    ReorderPolicy:
      type: object
      properties:
        sku:
          type: string
        locationId:
          type: string
        reorderPoint:
          type: number
        safetyStock:
          type: number
        economicOrderQuantity:
          type: number
    WebhookSubscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        url:
          type: string
        eventTypes:
          type: array
          items:
            type: string
    WebhookDeliveryLog:
      type: object
      properties:
        id:
          type: string
        subscriptionId:
          type: string
        eventName:
          type: string
        status:
          type: string
        statusCode:
          type: number
        occurredOn:
          type: string
    WarehouseLocation:
      type: object
      properties:
        id:
          type: string
        warehouseId:
          type: string
        zone:
          type: string
        maxWeightGrams:
          type: number
        maxVolumeCubicMeters:
          type: number
    PutawaySuggestion:
      type: object
      properties:
        locationId:
          type: string
        sku:
          type: string
        suggestedQuantity:
          type: number
    PurchaseOrderItem:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: number
        unitCostCents:
          type: number
    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        supplier:
          type: string
        status:
          type: string
          enum:
          - draft
          - approved
          - sent
          - received
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderItem'
        createdAt:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
    AuditDiscrepancy:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        expectedQuantity:
          type: number
        actualQuantity:
          type: number
        discrepancyCount:
          type: number
        status:
          type: string
        detectedAt:
          type: string
        resolvedAt:
          type: string
    OutboxStats:
      type: object
      properties:
        pendingCount:
          type: number
        publishedCount:
          type: number
        failedCount:
          type: number
    OutboxEvent:
      type: object
      properties:
        id:
          type: string
        eventType:
          type: string
        payload:
          type: string
        error:
          type: string
        status:
          type: string
        occurredAt:
          type: string
    TenantAccountingConfig:
      type: object
      properties:
        tenantId:
          type: string
        accountingMethod:
          type: string
        costingMethod:
          type: string
        currencyCode:
          type: string
        fiscalYearStart:
          type: string
    QuarantinedItem:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        locationId:
          type: string
        quantity:
          type: number
        reason:
          type: string
        status:
          type: string
        createdAt:
          type: string
    ValuationItem:
      type: object
      properties:
        variantId:
          type: string
        sku:
          type: string
        name:
          type: string
        costingMethod:
          type: string
        totalQuantity:
          type: number
        totalValueCents:
          type: number
        unitCostCents:
          type: number
    RfidTag:
      type: object
      properties:
        epc:
          type: string
        sku:
          type: string
        serialNumber:
          type: string
        status:
          type: string
        lastSeenAt:
          type: string
        lastLocation:
          type: string
    RfidScanUpdate:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        locationId:
          type: string
        totalCount:
          type: number
        matchedCount:
          type: number
        unmatchedCount:
          type: number
        unmatchedEpcs:
          type: array
          items:
            type: string
